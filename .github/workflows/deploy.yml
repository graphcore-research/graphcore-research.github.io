name: Build, Deploy, and On-Demand Preview

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - synchronize
  issue_comment:
    types:
      - created

env:
  PREVIEW_ROOT: pr-preview
  PREVIEW_MAX_AGE_DAYS: "30"
  # Numeric-ID no-reply address used by actions/checkout's commit example:
  # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run mkdocs build --strict

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run mkdocs build --strict

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Deploy main site to gh-pages
        run: |
          set -euo pipefail

          # First remove all non-preview content from the previous release
          find gh-pages -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name "${PREVIEW_ROOT}" \
            -exec rm -rf {} +
          cp -a site/. gh-pages/
          touch gh-pages/.nojekyll
          python tools/manage_previews.py \
            prune "gh-pages/${PREVIEW_ROOT}" "${PREVIEW_MAX_AGE_DAYS}"

          cd gh-pages
          git add --all
          if git diff --cached --quiet; then
            echo "No gh-pages changes to deploy."
          else
            git commit -m "Deploy main site"
            git push origin HEAD:gh-pages
          fi

  preview-request:
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/preview')
      ) || (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'synchronize'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.preview.outputs.enabled }}
      head_sha: ${{ steps.preview.outputs.head_sha }}
      pr_number: ${{ steps.preview.outputs.pr_number }}
      preview_url: ${{ steps.preview.outputs.preview_url }}
    steps:
      - name: Checkout preview state
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview-state
          fetch-depth: 1
          persist-credentials: false

      - name: Read command and PR metadata
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request_target" ] && \
            [ ! -f "preview-state/${PREVIEW_ROOT}/pr-${PR_NUMBER}/.deployed-at" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            preview_url="https://${repo_name}/${PREVIEW_ROOT}/pr-${PR_NUMBER}/"
          else
            preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/${PREVIEW_ROOT}/pr-${PR_NUMBER}/"
          fi
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')"
          base_repo="$(printf '%s' "$pr_json" | jq -r '.base.repo.full_name')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"

          if [ "$head_repo" != "$base_repo" ]; then
            echo "::error::PR previews are only supported for branches in this repository."
            exit 1
          fi
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "::error::Could not determine the PR head SHA."
            exit 1
          fi

          {
            echo "enabled=true"
            echo "head_sha=${head_sha}"
            echo "pr_number=${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"

  build-preview:
    if: needs.preview-request.outputs.enabled == 'true'
    needs: preview-request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preview-request.outputs.head_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: uv sync

      - name: Build preview
        env:
          SITE_URL: ${{ needs.preview-request.outputs.preview_url }}
        run: uv run mkdocs build --strict

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ needs.preview-request.outputs.pr_number }}
          path: site
          if-no-files-found: error

  # Keep this separate: build-preview executes PR-controlled dependency and
  # MkDocs hook code, which must never have this job's write-capable token.
  update-preview:
    needs:
      - preview-request
      - build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout trusted preview tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
          persist-credentials: false

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ needs.preview-request.outputs.pr_number }}
          path: preview-site

      - name: Update previews
        env:
          PR_NUMBER: ${{ needs.preview-request.outputs.pr_number }}
        run: |
          set -euo pipefail

          python source/tools/manage_previews.py deploy \
            "gh-pages/${PREVIEW_ROOT}" "$PR_NUMBER" preview-site \
            "/${PREVIEW_ROOT}/pr-${PR_NUMBER}" "${PREVIEW_MAX_AGE_DAYS}"

          cd gh-pages
          git add --all "${PREVIEW_ROOT}"
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            git commit -m "Deploy PR ${PR_NUMBER} preview"
            git push origin HEAD:gh-pages
          fi

      - name: Comment with preview URL
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ needs.preview-request.outputs.preview_url }}
          PR_NUMBER: ${{ needs.preview-request.outputs.pr_number }}
        run: |
          set -euo pipefail

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Preview published: ${PREVIEW_URL} (expires after ${PREVIEW_MAX_AGE_DAYS} days).

          Note: Preview URL rewriting may miss some absolute resource links (if they work in local builds, you're probably OK)."
